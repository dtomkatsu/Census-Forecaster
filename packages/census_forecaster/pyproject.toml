[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "census-forecaster"
version = "0.2.0"
description = "Forecast current-period values from older ACS estimates and BLS series, with calibrated uncertainty."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tom Katsumi", email = "dtomkatsu@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = ["acs", "census", "bls", "forecasting", "nowcasting", "cpi", "inflation"]
dependencies = [
    "requests>=2.28",
    "census-common",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
ml = ["scikit-learn>=1.1", "numpy>=1.21"]
# yfinance is an optional primary price source; the Stooq fallback in
# markets/client.py is stdlib-only, so the markets subpackage works
# without this extra (yfinance drags pandas — keep it out of core).
markets = ["yfinance>=0.2", "numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/dtomkatsu/Census-Forecaster"
Issues = "https://github.com/dtomkatsu/Census-Forecaster/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/census_forecaster"]

[tool.hatch.build.targets.wheel.force-include]
"src/census_forecaster/data" = "census_forecaster/data"
