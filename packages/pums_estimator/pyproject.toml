[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pums-estimator"
version = "0.1.0"
description = "Estimate county-level distributions from PUMS microdata reweighted to census_forecaster county controls."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tom Katsumi", email = "dtomkatsu@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "census-common",
    "census-forecaster",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/pums_estimator"]
