[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "census-forecaster"
version = "0.2.0"
description = "Forecast current-period values from older ACS estimates and BLS series, with calibrated uncertainty."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Tom Katsumi", email = "dtomkatsu@gmail.com"},
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering",
]
keywords = ["acs", "census", "bls", "forecasting", "nowcasting", "cpi", "inflation"]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
ml = [
    "scikit-learn>=1.1",
    "numpy>=1.21",
]

[project.urls]
Homepage = "https://github.com/dtomkatsu/Census-Forecaster"
Issues = "https://github.com/dtomkatsu/Census-Forecaster/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"census_forecaster" = [
    "data/anchors/*.json",
    "data/anchors/*.md",
    "data/calibration_panel/*.json",
    "data/calibration_panel/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
